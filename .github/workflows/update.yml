name: Update Google Antigravity

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        env:
          DISABLE_FLAKEHUB: "true"
        with:
          flakehub: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run update script
        id: update
        run: |
          chmod +x scripts/update-version.sh

          # Capture output and show it for debugging
          if ./scripts/update-version.sh 2>&1 | tee update_output.txt; then
            echo "update_success=true" >> $GITHUB_OUTPUT

            # Check if versions.json was modified
            if git diff --quiet artifacts/versions.json; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT

              # Extract a version string for the PR branch name (use IDE version)
              NEW_VERSION=$(jq -r '.["Antigravity IDE"]["x86_64-linux"].url | match("[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+").string' artifacts/versions.json 2>/dev/null || \
                            jq -r '.["Antigravity 2.0"]["x86_64-linux"].url | match("[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+").string' artifacts/versions.json 2>/dev/null || \
                            echo "unknown")
              echo "Detected new version: $NEW_VERSION"
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "update_success=false" >> $GITHUB_OUTPUT
            echo "=== Update script failed ==="
            cat update_output.txt
            exit 1
          fi

      # Hard gate: the products people actually install. A version bump can move
      # files the installPhase hardcodes, and that only shows up at build time,
      # so this has to build rather than trust the prefetched hashes. Runner
      # architecture only — the other three platforms cannot be built here, and
      # four Electron trees would not fit on the runner's disk anyway.
      - name: Build Antigravity IDE, Desktop and CLI
        if: steps.update.outputs.has_changes == 'true'
        run: |
          nix build -L --no-link \
            .#google-antigravity-ide \
            .#google-antigravity-desktop \
            .#google-antigravity-cli

      # Soft check: the SDK is a pre-1.0 PyPI package and breaks far more often
      # than the stable products. It used to be a hard gate, and on 2026-07-21
      # that stopped being a safety net and became the bug: google-antigravity
      # 0.1.12 ships protobuf gencode 7.35.0 while nixpkgs carries runtime
      # 6.33.0, protobuf refuses the mismatch, and every daily run failed before
      # opening a PR. Four IDE releases went unproposed because an optional
      # Python package would not import. It reports now instead of blocking; the
      # PR body carries the result so a broken SDK is still visible.
      - name: Build Antigravity SDK
        id: sdk
        if: steps.update.outputs.has_changes == 'true'
        continue-on-error: true
        run: nix build -L --no-link .#google-antigravity-sdk

      - name: Record SDK build result
        id: sdkstatus
        if: steps.update.outputs.has_changes == 'true'
        run: |
          if [ "${{ steps.sdk.outcome }}" = "success" ]; then
            echo "sdk_status=:white_check_mark: SDK builds" >> $GITHUB_OUTPUT
          else
            echo "sdk_status=:warning: **SDK build FAILED** — merging anyway; the IDE, Desktop and CLI are unaffected. Investigate separately." >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update antigravity to ${{ steps.update.outputs.new_version }}"
          title: "chore: update antigravity to ${{ steps.update.outputs.new_version }}"
          body: |
            ## Google Antigravity Update

            This PR updates Google Antigravity to version **${{ steps.update.outputs.new_version }}**.

            ### Changes
            - Updated URLs and hashes in `artifacts/versions.json`

            ### Testing
            - ✅ IDE, Desktop and CLI built on x86_64-linux
            - ${{ steps.sdkstatus.outputs.sdk_status }}

            Hashes for the other three platforms are prefetched, not built —
            `nix-prefetch-url` verifies the download, not the install phase.

            ### Changelog
            See: https://antigravity.google/releases

            ---
            🤖 This PR was created automatically by the auto-update workflow.
          branch: auto-update/antigravity-${{ steps.update.outputs.new_version }}
          delete-branch: true
          labels: |
            automated
            antigravity-update

      - name: Enable auto-merge
        if: steps.update.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        run: |
          # Retry loop with exponential backoff to find the PR
          MAX_ATTEMPTS=5
          ATTEMPT=1
          WAIT_TIME=5

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Looking for PR..."

            PR_NUMBER=$(gh pr list --head "auto-update/antigravity-$NEW_VERSION" --json number --jq '.[0].number')

            if [ -n "$PR_NUMBER" ]; then
              echo "Found PR #$PR_NUMBER"
              echo "Enabling auto-merge..."

              if gh pr merge "$PR_NUMBER" --auto --squash; then
                echo "✓ Auto-merge enabled for PR #$PR_NUMBER"
                exit 0
              else
                echo "⚠ Failed to enable auto-merge, but PR exists"
                exit 0
              fi
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "PR not found yet, waiting ${WAIT_TIME}s before retry..."
              sleep $WAIT_TIME
              WAIT_TIME=$((WAIT_TIME * 2))  # Exponential backoff
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "⚠ Could not find PR after $MAX_ATTEMPTS attempts"
          echo "The PR may have been created but not yet visible via API"

      - name: Report status
        if: always()
        env:
          UPDATE_SUCCESS: ${{ steps.update.outputs.update_success }}
          HAS_CHANGES: ${{ steps.update.outputs.has_changes }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        run: |
          if [[ "$UPDATE_SUCCESS" == "true" ]]; then
            if [[ "$HAS_CHANGES" == "true" ]]; then
              echo "✅ Update successful! New version: $NEW_VERSION"
            else
              echo "✅ Already at latest version"
            fi
          else
            echo "❌ Update failed"
            exit 1
          fi
